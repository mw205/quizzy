<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzy - Student Registration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="icon" href="../assets/Q.ico?v=1" type="image/x-icon" />
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center py-4 px-2">
  <div class="container auth-container" style="max-width: 560px; width: 100%;">
    <div class="text-center mb-4">
      <img src="../assets/quizzy logo.png" alt="Quizzy Logo" class="img-fluid" style="max-width: 240px;" />
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <h2 class="h4 card-title text-center fw-bold mb-4">Student Register</h2>

        <form id="registrationForm">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Full Name" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="student@example.com" required />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="At least 6 characters" minlength="6" required />
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold mb-3" type="submit">
            Create Account
          </button>
        </form>

        <div class="text-center mt-3">
          <a href="../index.html" class="text-decoration-none fw-semibold">Already have an account? Sign in</a>
        </div>

        <hr class="my-4 text-muted" />

        <div class="text-center">
          <a href="teacher-login.html" class="btn btn-outline-secondary btn-sm w-100">Login as Teacher</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
