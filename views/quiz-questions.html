<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Active Exam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/student-quiz-style.css" />
    <link rel="icon" href="../assets/Q.ico?v=1" type="image/x-icon" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand navbar-dark bg-primary px-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../assets/logo.png" alt="Quizzy Logo" height="36" class="me-2" />
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button class="btn btn-outline-light btn-sm rounded-circle" id="mode" type="button" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="btn btn-light btn-sm fw-semibold" id="logout" type="button">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4 d-flex justify-content-center">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden quiz-question-container" style="max-width: 760px; width: 100%;">
        <div class="quiz-img-container text-center" id="questionImageContainer" style="display: none;">
          <img src="../assets/img-placeholder.jpg" id="questionImage" alt="Question Image" class="img-fluid" style="max-height: 320px; width: 100%; object-fit: cover;" />
        </div>

        <div class="p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-6 px-3 py-2" id="qIndex">Question 1 / 10</span>
            <div class="fw-bold text-danger fs-6 d-flex align-items-center">
              <i class="fa-regular fa-clock me-2"></i>Time Left: <span id="timerDisplay" class="ms-1">15:00</span>
            </div>
          </div>

          <h4 class="question-title fw-bold mb-4" id="qText">Question Text</h4>

          <div class="quiz-question mb-4" id="choicesContainer"></div>

          <button class="btn btn-primary btn-lg w-100 fw-bold py-3" id="nextBtn" disabled>
            Next Question <i class="fa-solid fa-arrow-right ms-2"></i>
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
