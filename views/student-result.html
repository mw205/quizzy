<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Exam Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/quiz-result.css" />
    <link rel="icon" href="../assets/Q.ico?v=1" type="image/x-icon" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand navbar-dark bg-primary px-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../assets/logo.png" alt="Quizzy Logo" height="36" class="me-2" />
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button class="btn btn-outline-light btn-sm rounded-circle" id="mode" type="button" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="btn btn-light btn-sm fw-semibold" id="logout" type="button">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4 d-flex flex-column align-items-center">
      <!-- Greeting Banner -->
      <div class="card border-0 shadow-lg rounded-4 bg-primary text-white text-center p-4 mb-4 greeting-massage" style="max-width: 760px; width: 100%;">
        <div class="display-3 text-warning mb-2"><i class="fa-solid fa-trophy"></i></div>
        <h2 class="fw-bold mb-2">Congratulations!</h2>
        <p class="mb-0 opacity-75">
          You have completed <strong id="resExamName" class="text-white">Exam Title</strong>
        </p>
      </div>

      <!-- Result Card -->
      <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 text-center mb-4 result-section" style="max-width: 760px; width: 100%;">
        <h4 class="fw-bold mb-4"><i class="fa-solid fa-chart-pie me-2 text-primary"></i>Your Performance Summary</h4>

        <div class="row g-3 mb-4">
          <div class="col-4">
            <div class="p-3 bg-light rounded-3 border">
              <span class="text-muted text-sm d-block mb-1">Total Questions</span>
              <strong id="resTotalQuestions" class="fs-4 text-dark">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div class="p-3 bg-success-subtle border border-success-subtle rounded-3">
              <span class="text-success text-sm d-block mb-1"><i class="fa-solid fa-circle-check me-1"></i>Correct</span>
              <strong class="correct-count fs-4 text-success">0</strong>
            </div>
          </div>
          <div class="col-4">
            <div class="p-3 bg-danger-subtle border border-danger-subtle rounded-3">
              <span class="text-danger text-sm d-block mb-1"><i class="fa-solid fa-circle-xmark me-1"></i>Wrong</span>
              <strong class="wrong-count fs-4 text-danger">0</strong>
            </div>
          </div>
        </div>

        <div class="p-3 bg-primary-subtle border border-primary-subtle rounded-3 d-flex justify-content-between align-items-center mb-4">
          <span class="fw-bold text-primary fs-5"><i class="fa-solid fa-star me-2"></i>Final Score</span>
          <strong class="quiz-score fs-2 text-primary" id="resScore">0%</strong>
        </div>

        <button class="btn btn-primary btn-lg w-100 fw-bold back" id="backBtn">
          <i class="fa-solid fa-house me-2"></i>Back to Dashboard
        </button>
      </div>

      <!-- Question-by-Question Review -->
      <div id="reviewContainer" style="max-width: 760px; width: 100%;"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
