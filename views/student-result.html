<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Dashboard</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/quiz-result.css" />
  </head>
  <body>
    <nav class="flex w-full">
      <h1 class="logo">Quizzy</h1>
      <div class="right flex">
        <button class="btn btn-primary" id="mode">🌙</button>
        <button class="btn btn-primary" id="logout">Logout</button>
      </div>
    </nav>

    <main class="container flex flex-col">
      <section class="card flex greeting-massage flex-col items-center">
        <h2>🏆</h2>
        <h2>Congratulations!</h2>
        <p class="mt-2">
          You have completed the quiz:
          <strong class="quiz-title">Animal Kingdom Quiz</strong>
        </p>
      </section>
      <section class="card flex result-section flex-col items-center">
        <h2>Your Quiz Results</h2>
        <div class="quiz-result-details flex flex-col gap-4 mt-4">
          <p>
            Total Questions: <strong class="quiz-question-count">15</strong>
          </p>
          <p>Correct Answers: <strong class="correct-count">8</strong></p>
          <p>Wrong Answers: <strong class="wrong-count">7</strong></p>
          <p class="score-row">
            Your Score: <strong class="quiz-score">80%</strong>
          </p>
        </div>
        <button class="btn btn-primary mt-4">Back to Dashboard</button>
      </section>
    </main>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
