<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Login</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>

  <body>
    <div class="container login-container">
      <h1 class="text-center mb-6 mt-4">Quizzy</h1>
      <div class="card mb-4">
        <div class="login-form">
          <h2 class="mb-6">Teacher Login</h2>
          <form action="" id="teacherLoginForm">
            <div class="input-group">
              <label for="username">Username</label>
              <input
                type="text"
                name="username"
                placeholder="username"
                required
              />
            </div>
            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                placeholder="password"
                required
              />
            </div>
            <button class="btn w-full btn-primary mb-4" type="submit">
              Login
            </button>
          </form>
          <hr class="mt-4 mb-4" />
          <p class="text-center">
            <a href="../index.html">Login As a Student</a>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
