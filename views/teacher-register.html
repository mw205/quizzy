<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzy - Teacher Registration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="icon" href="../assets/Q.ico?v=1" type="image/x-icon" />
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center py-4 px-2">
  <div class="container auth-container" style="max-width: 560px; width: 100%;">
    <div class="text-center mb-4">
      <img src="../assets/quizzy logo.png" alt="Quizzy Logo" class="img-fluid" style="max-width: 240px;" />
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <h2 class="h4 card-title text-center fw-bold mb-4">
          <i class="fa-solid fa-user-plus me-2 text-primary"></i>Create Teacher Account
        </h2>

        <form id="teacherRegistrationForm">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
              <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Full Name" required />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
              <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="teacher@example.com" required />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="At least 6 characters" minlength="6" required />
            </div>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold mb-3" type="submit">
            <i class="fa-solid fa-check-circle me-2"></i>Create Account
          </button>
        </form>

        <div class="text-center mt-3">
          <a href="teacher-login.html" class="text-decoration-none fw-semibold">
            <i class="fa-solid fa-arrow-left me-1"></i>Back to Teacher Login
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../scripts/app.js"></script>
</body>
</html>
