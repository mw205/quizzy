<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Teacher Registration</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <div class="container login-container">
      <h1 class="text-center mb-6 mt-6">
        <img src="../assets/quizzy logo.png" alt="Quizzy Logo" width="250" />
      </h1>
      <div class="card mb-4">
        <div class="login-form">
          <h2 class="mb-6">Create Teacher Account</h2>
          <form id="teacherRegistrationForm">
            <div class="input-group">
              <label for="name">Full name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" minlength="6" required />
            </div>
            <button class="btn w-full btn-primary mb-4" type="submit">
              Create account
            </button>
          </form>
          <p class="text-center"><a href="teacher-login.html">Back to teacher login</a></p>
        </div>
      </div>
    </div>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
