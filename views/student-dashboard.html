<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Student Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/student-dashboard-style.css" />
    <link rel="icon" href="../assets/Q.ico?v=1" type="image/x-icon" />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand navbar-dark bg-primary px-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../assets/logo.png" alt="Quizzy Logo" height="36" class="me-2" />
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button class="btn btn-outline-light btn-sm rounded-circle" id="mode" type="button" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="btn btn-light btn-sm fw-semibold" id="logout" type="button">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container dashboard-container py-4">
      <!-- Profile Welcome Section -->
      <section class="card border-0 shadow-sm rounded-4 p-4 profile-section mb-4">
        <div class="row align-items-center g-3">
          <div class="col-md-8 text-center text-md-start">
            <h2 class="fw-bold mb-2">
              Welcome back, <span class="username text-primary">Student</span>! <i class="fa-solid fa-hand-sparkles text-warning ms-1"></i>
            </h2>
            <p class="text-muted mb-0">Ready to master your courses and test your knowledge?</p>
          </div>
          <div class="col-md-4 text-center">
            <img src="../assets/profile-placeholder.png" alt="Profile Picture" id="profile-picture" class="img-thumbnail rounded-circle shadow-sm" style="width: 90px; height: 90px; object-fit: cover;" />
            <h6 class="fw-bold mt-2 mb-0"><span class="username">Student</span></h6>
            <p class="text-muted text-sm mb-0 grade"></p>
          </div>
        </div>
      </section>

      <!-- Progress Section -->
      <section class="card border-0 shadow-sm rounded-4 progress-section p-4 mb-4">
        <div class="row align-items-center g-3">
          <div class="col-md-4 text-center text-md-start">
            <h3 class="fw-bold text-white mb-1"><i class="fa-solid fa-chart-line me-2"></i>Your Progress</h3>
            <p class="text-white-50 text-sm mb-0">Track your completed quizzes and overall performance</p>
          </div>
          <div class="col-md-8">
            <div class="row g-3">
              <div class="col-6">
                <div class="card border-0 shadow-sm p-3 text-center rounded-3 bg-white">
                  <div class="h3 text-warning mb-1"><i class="fa-solid fa-trophy"></i></div>
                  <span class="text-muted text-sm fw-semibold">Quizzes Taken</span>
                  <strong id="statCompleted" class="fs-3 text-dark">0</strong>
                </div>
              </div>
              <div class="col-6">
                <div class="card border-0 shadow-sm p-3 text-center rounded-3 bg-white">
                  <div class="h3 text-warning mb-1"><i class="fa-solid fa-star"></i></div>
                  <span class="text-muted text-sm fw-semibold">Average Score</span>
                  <strong id="statAvg" class="fs-3 text-primary">0%</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Available Quizzes Section -->
      <section class="mb-4">
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-book-open me-2 text-primary"></i>Available Assignments</h4>
        <ul class="quiz-list" id="pendingList"></ul>
      </section>

      <hr class="my-4 text-muted" />

      <!-- Completed Quizzes Section -->
      <section>
        <h4 class="fw-bold mb-3"><i class="fa-solid fa-circle-check me-2 text-success"></i>Completed Quizzes</h4>
        <ul class="quiz-list" id="completedList"></ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
