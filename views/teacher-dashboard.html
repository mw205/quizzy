<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzy - Teacher Dashboard</title>
    <link rel="stylesheet" href="../styles/teacher-dashboard.css" />
    <link rel="icon" href="/assets/Q.ico?v=1" type="image/x-icon" />
  </head>
  <body>
    <header>
      <nav class="flex w-full">
        <h1 class="logo"><img src="../assets/logo.png" alt="Quizzy Logo" width="100" /></h1>
        <div class="right flex">
          <button class="btn btn-primary" id="mode">🌙</button>
          <button class="btn btn-primary" id="logout">Logout</button>
        </div>
      </nav>
    </header>
    <div class="app-layout flex">
      <aside class="sidebar flex flex-col">
        <h1 class="logo">Hello, <b id="teacherName">Teacher</b></h1>
        <button class="nav-btn w-full" data-tab="coursesTab">📚 Courses</button>
        <button class="nav-btn w-full" data-tab="questionsTab">📝 Question Bank</button>
        <button class="nav-btn w-full" data-tab="examBuilderTab">🎯 Design Exam</button>
        <button class="nav-btn w-full" data-tab="examsTab">🧾 Generated Exams</button>
      </aside>
      <main class="main-content flex flex-col">
        <div class="scrollable-area">
          <section class="tab-content hidden" id="coursesTab">
            <h3>Courses and Chapters</h3>
            <form class="card mb-4" id="createCourseForm">
              <h4 class="mb-2">Create a course</h4>
              <div class="grid-2">
                <div class="input-group">
                  <label for="courseTitle">Course name</label>
                  <input id="courseTitle" name="title" minlength="3" maxlength="100" required />
                </div>
                <div class="input-group">
                  <label for="chapterCount">Number of chapters</label>
                  <input id="chapterCount" name="chapterCount" type="number" min="1" required />
                </div>
              </div>
              <button class="btn btn-primary" type="submit">Create course</button>
              <p id="courseStatus" class="text-sm" aria-live="polite"></p>
            </form>
            <div id="courseList"></div>
          </section>

          <section class="tab-content hidden" id="questionsTab">
            <h3>Question Bank Manager</h3>
            <form class="card" id="createQuestionForm">
              <div class="grid-2">
                <div class="input-group">
                  <label for="questionCourseSelect">Course</label>
                  <select id="questionCourseSelect"></select>
                </div>
                <div class="input-group">
                  <label for="questionChapterSelect">Chapter</label>
                  <select id="questionChapterSelect" name="chapterId" required></select>
                </div>
              </div>
              <div class="input-group">
                <label for="questionText">Question text</label>
                <textarea id="questionText" name="text" required></textarea>
              </div>
              <div class="grid-2">
                <div class="input-group">
                  <label for="difficulty">Difficulty</label>
                  <select id="difficulty" name="difficulty"><option value="SIMPLE">Simple</option><option value="DIFFICULT">Difficult</option></select>
                </div>
                <div class="input-group">
                  <label for="objective">Educational objective</label>
                  <select id="objective" name="objective"><option value="REMEMBERING">Remembering</option><option value="UNDERSTANDING">Understanding</option><option value="CREATIVITY">Creativity</option></select>
                </div>
              </div>
              <div class="input-group">
                <label for="questionImage">Question image (optional)</label>
                <input id="questionImage" type="file" accept="image/*" />
                <input id="questionImageUrl" name="imageUrl" type="hidden" />
              </div>
              <h4 class="mb-2">Exactly three choices</h4>
              <div class="grid-3">
                <input name="choice" placeholder="Choice 1" required />
                <input name="choice" placeholder="Choice 2" required />
                <input name="choice" placeholder="Choice 3" required />
              </div>
              <div class="input-group">
                <label for="correctChoice">Correct choice</label>
                <select id="correctChoice" name="correctChoice"><option value="0">Choice 1</option><option value="1">Choice 2</option><option value="2">Choice 3</option></select>
              </div>
              <button class="btn btn-primary" type="submit">Save question</button>
              <p id="questionStatus" class="text-sm" aria-live="polite"></p>
            </form>
          </section>

          <section class="tab-content hidden" id="examBuilderTab">
            <h3>Design and Generate an Exam</h3>
            <div class="card mb-4">
              <div class="input-group">
                <label for="builderCourseSelect">Course</label>
                <select id="builderCourseSelect"></select>
              </div>
              <h4 class="mb-2">Questions per chapter</h4>
              <div id="chapterRequirements"></div>
              <div class="grid-2 mb-4">
                <div class="border p-3 rounded">
                  <h4 class="mb-2">Difficulty</h4>
                  <label>Simple <input id="simpleReq" class="constraint-input" type="number" min="0" value="0" /></label>
                  <label>Difficult <input id="difficultReq" class="constraint-input" type="number" min="0" value="0" /></label>
                </div>
                <div class="border p-3 rounded">
                  <h4 class="mb-2">Educational objectives</h4>
                  <label>Remembering <input id="remReq" class="constraint-input" type="number" min="0" value="0" /></label>
                  <label>Understanding <input id="undReq" class="constraint-input" type="number" min="0" value="0" /></label>
                  <label>Creativity <input id="creReq" class="constraint-input" type="number" min="0" value="0" /></label>
                </div>
              </div>
              <div class="p-3 rounded mb-4 border">
                <strong>Constraint totals:</strong> <span id="totalsSummary"></span>
                <p id="constraintFeedback" class="text-sm"></p>
              </div>
              <button id="generateExamBtn" class="btn btn-primary" type="button">Generate optimum recommendation</button>
              <p id="builderStatus" class="text-sm" aria-live="polite"></p>
            </div>
            <div id="generatedExamOutput" class="hidden">
              <div class="card">
                <h4>Generated recommendation</h4>
                <span id="matchScoreBadge" class="badge"></span>
                <div class="table-container mb-4"><table class="w-full"><thead><tr><th>Category</th><th>Requested</th><th>Actual</th><th>Status</th></tr></thead><tbody id="distributionSummaryBody"></tbody></table></div>
                <div id="generatedQuestionsList"></div>
              </div>
            </div>
          </section>

          <section class="tab-content hidden" id="examsTab">
            <div class="flex justify-between items-center mb-4"><h3>Generated Exams</h3><button id="refreshExamsBtn" class="btn btn-outline" type="button">Refresh</button></div>
            <div id="exams-list"></div>
          </section>
          <p id="dashboardStatus" class="text-sm" aria-live="polite"></p>
        </div>
      </main>
    </div>
    <script type="module" src="../scripts/app.js"></script>
  </body>
</html>
