<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizzy - Student Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="icon" href="./assets/Q.ico?v=1" type="image/x-icon" />
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <img src="./assets/quizzy logo.png" alt="Quizzy Logo" class="img-fluid" style="max-width: 220px;" />
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-sm-5">
        <h2 class="h4 card-title text-center fw-bold mb-4">Student Login</h2>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="student@example.com" required />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Password" required />
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold mb-3" type="submit">
            Sign In
          </button>
        </form>

        <div class="text-center mt-3">
          <a href="views/register.html" class="text-decoration-none fw-semibold">Create Student Account</a>
        </div>

        <hr class="my-4 text-muted" />

        <div class="text-center">
          <a href="views/teacher-login.html" class="btn btn-outline-secondary btn-sm w-100">Login as Teacher</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
