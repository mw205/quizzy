<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container login-container">
        <h1 class="text-center mb-6">Quizzy</h1>
        <div class="card mb-4">
            <div class="login-form">
                <h2 class="mb-6">
                    Student Login
                </h2>
                <form action="">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" name="username" placeholder="username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" placeholder="password" required>
                    </div>
                    <button class="btn w-full btn-primary" type="submit">Login</button>
                </form>
                <p class="text-center mt-4 mb-4"><a href="register.html">Create Student Account</a></p>
                <p class="text-center"><a href="teacher-login.html">Login As a teacher</a></p>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
